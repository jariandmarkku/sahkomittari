# Spotpuls ESPHome / ESP32 Controller (runs at the top of every hour :00:05)
# Docs: https://spotpuls.app/api-docs/

http_request:
  useragent: esphome-spotpuls
  timeout: 10s

switch:
  - platform: gpio
    pin: GPIO12
    id: load_relay
    name: "Boiler / EV Relay"

time:
  - platform: sntp
    id: sntp_time
    on_time:
      - seconds: 5
        minutes: 0
        hours: "*"
        then:
          - http_request.get:
              url: "https://spotpuls.app/api/v1/plain/FI?field=run_now&window=3"
              on_response:
                then:
                  - lambda: |-
                      if (response->status_code == 200) {
                        if (body == "1") {
                          id(load_relay).turn_on();
                        } else if (body == "0") {
                          id(load_relay).turn_off();
                        }
                      }
